# User-mode logrotate config, run daily by polymarket-logrotate.timer as the
# bot user (state file: logs/.logrotate.state). copytruncate: systemd keeps
# live.log open with O_APPEND, so the file is copied and truncated in place and
# the bot never needs a restart. Keeps 14 days.
/home/rasbardi/polymarket-bot/logs/live/live.log {
    daily
    rotate 14
    maxage 14
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
    dateext
}
